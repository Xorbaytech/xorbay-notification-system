name: Notification CI/CD

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Check CI environment
      - name: Check CI environment
        run: |
          echo "DATABASE_URL is set: ${DATABASE_URL:+yes}"
          node --version
          npm --version

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Generate Prisma Client
      - name: Generate Prisma Client
        run: npm run prisma:generate

      # 6. Lint
      - name: Lint
        run: npm run lint

      # 7. Run tests
      - name: Test
        run: npm test

      # 8. Build NestJS application
      - name: Build
        run: npm run build

      # 9. Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 10. Build Docker image and push to GHCR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/xorbaytech/xorbay-notification-system:${{ github.sha }}

      # 11. Deploy to staging
      - name: Deploy to staging
        env:
          SSH_PASSPHRASE: ${{ secrets.STAGING_SSH_PASSPHRASE }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > /tmp/staging_key
          chmod 600 /tmp/staging_key

          cat > /tmp/askpass.sh <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SSH_PASSPHRASE"
          EOF

          chmod 700 /tmp/askpass.sh

          eval "$(ssh-agent -s)"

          export SSH_ASKPASS=/tmp/askpass.sh
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0

          ssh-add /tmp/staging_key
          echo "GitHub Actions SSH key fingerprint:"
          ssh-add -l

          ssh \
            -o IdentitiesOnly=yes \
            -i /tmp/staging_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} \
            "docker pull ghcr.io/xorbaytech/xorbay-notification-system:${{ github.sha }}"

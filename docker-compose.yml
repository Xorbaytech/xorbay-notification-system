services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      - PORT=3002
      - NODE_ENV=production
      # Using direct Neon endpoint (without -pooler) for persistent worker transaction support
      - DATABASE_URL=postgresql://neondb_owner:npg_mLcBy7urWM0R@ep-rough-leaf-b3t133vu.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
